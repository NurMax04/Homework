<!doctype html>
<html class="page" lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dyson</title>
    <link rel="stylesheet" href="./css/index.css" />
    <link
      rel="shortcut icon"
      href="./icon/logo-dyson.svg"
      type="image/x-icon"
    />
  </head>
  <body class="page__body">
    <header class="container header__container">
      <nav class="header__menu">
        <ul class="menu__list">
          <li class="menu__item">
            <a class="menu__link" href="#">
              <img src="./icon/burger-menu.svg" alt="Меню" />
            </a>
          </li>
          <li class="menu__item">
            <a class="menu__link" href="#">
              <img src="./icon/logo-dyson.svg" alt="Логотип компании Dyson" />
            </a>
          </li>
          <li class="menu__item">
            <a class="menu__link" href="#">О нас</a>
          </li>
          <li class="menu__item">
            <a class="menu__link" href="#">Доставка и оплата</a>
          </li>
          <li class="menu__item">
            <a class="menu__link" href="#">Регистрация продукта</a>
          </li>
          <li class="menu__item">
            <a class="menu__link" href="#">Сервис</a>
          </li>
          <li class="menu__item">
            <a class="menu__link" href="#">Сертификаты и лицензии</a>
          </li>
          <li class="menu__item">
            <a class="menu__link" href="#">
              <img src="./icon/cart.svg" alt="Корзина" />
            </a>
          </li>
        </ul>
      </nav>
    </header>
    <main>
      <section class="container hero__container">
        <div class="hero__content">
          <h1 class="content__title title-large">
            <span>Уникальные технологии</span>
            <span>для ухода за волосами</span>
          </h1>
          <p class="title-p">
            <span>Идеальная укладка для всех типов волос </span>
            <span>вместе с Dyson</span>
          </p>
          <button class="hero__button">Подробнее</button>
        </div>
        <picture>
          <img
            class="hero__img"
            src="./image/hero-img.png"
            alt="Девушка сушит волосы с феном Dyson "
          />
        </picture>
      </section>
      <section class="production__container container">
        <div class="production__categories">
          <a href="#" class="production__item">
            <header>
              <img src="./image/sale-img.jpg" alt="Категория Акции" />
            </header>
            <footer class="production__item-footer">
              <h3 class="production__title title-xs">Акции</h3>
              <span>Подробнее</span>
              <svg>
                <use href="./icon/sprite.svg#right-arrow"></use>
              </svg>
            </footer>
          </a>
          <a href="#" class="production__item">
            <img src="./image/fens-img.jpg" alt="Категория Фены" />
            <h3 class="production__title title-xs">Фены</h3>
            <svg>
              <use href="./icon/sprite.svg#right-arrow"></use>
            </svg>
          </a>
          <a href="#" class="production__item">
            <img src="./image/stailer-img.jpg" alt="Категория Стайлеры" />
            <h3 class="production__title title-xs">Стайлеры</h3>
            <svg>
              <use href="./icon/sprite.svg#right-arrow"></use>
            </svg>
          </a>
          <a href="#" class="production__item">
            <img
              src="./image/straighteners-img.jpg"
              alt="Категория Выпрямители"
            />
            <h3 class="production__title title-xs">Выпрямители</h3>
            <svg>
              <use href="./icon/sprite.svg#right-arrow"></use>
            </svg>
          </a>
          <a href="#" class="production__item">
            <img src="./image/sale-img.jpg" alt="Категория Акции" />
            <h3 class="production__title title-xs">Акции</h3>
            <svg>
              <use href="./icon/sprite.svg#right-arrow"></use>
            </svg>
          </a>
          <a href="#" class="production__item">
            <img src="./image/fens-img.jpg" alt="Категория Фены" />
            <h3 class="production__title title-xs">Фены</h3>
            <svg>
              <use href="./icon/sprite.svg#right-arrow"></use>
            </svg>
          </a>
          <a href="#" class="production__item">
            <img src="./image/stailer-img.jpg" alt="Категория Стайлеры" />
            <h3 class="production__title title-xs">Стайлеры</h3>
            <svg>
              <use href="./icon/sprite.svg#right-arrow"></use>
            </svg>
          </a>
          <a href="#" class="production__item">
            <img
              src="./image/straighteners-img.jpg"
              alt="Категория Выпрямители"
            />
            <h3 class="production__title title-xs">Выпрямители</h3>
            <svg>
              <use href="./icon/sprite.svg#right-arrow"></use>
            </svg>
          </a>
        </div>
      </section>
    </main>
  </body>
</html>
