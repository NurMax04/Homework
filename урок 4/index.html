<!doctype html>
<html lang="ru">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Практика по формам</title>
		<link rel="stylesheet" href="./css/style.css" />
	</head>
	<body>
		<form>
			<fieldset>
				<h3 class="title">Ваши личные данные</h3>
				<label>
					Ваше имя
					<input
						class="input"
						type="text"
						placeholder="Имя"
						name="name"
						required
					/>
				</label>
				<label>
					Ваш возраст
					<input
						class="input"
						type="number"
						placeholder="Возраст"
						name="numeric"
						name="age"
						required
					/>
				</label>
				<label>
					Ваш номер телефона
					<input
						class="input"
						type="tel"
						placeholder="Номер телефона"
						name="tel"
						inputmode="tel"
						required
					/>
				</label>
				<label>
					Ваша почта
					<input
						class="input"
						type="email"
						name="email"
						placeholder="Email/Gmail"
						required
					/>
				</label>
				<label>
					Сообщение
					<textarea
						class="input"
						required
						name="message"
						placeholder="Сообщение"
					></textarea>
				</label>
				<label class="label">
					<input type="checkbox" name="zxzx" value="zxzx" /> Я принимаю правила
				</label>
				<button class="button">
					<a href="./video/Voicy_rickroll.mp4">Отправить</a>
				</button>
			</fieldset>
		</form>
	</body>
</html>
