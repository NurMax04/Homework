<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Таблицы</title>
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <table>
      <caption>
        Статистика игроков
      </caption>
      <thead>
        <tr>
          <th>Имя</th>
          <th>Количество очков</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td colspan="2">Игрок-1</td>
        </tr>
        <tr>
          <td>игрок-2</td>
          <td>12</td>
        </tr>
      </tbody>
      <tfoot>
        <td>Общее:</td>
        <td>135</td>
      </tfoot>
    </table>
    <table>
      <tr>
        <td rowspan="2">Большая ячейка</td>
        <td>маленькая ячейка</td>
      </tr>
      <tr>
        <td>маленькая ячейка</td>
      </tr>
    </table>
  </body>
</html>
