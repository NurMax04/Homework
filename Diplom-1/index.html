<!doctype html>
<html lang="ru">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>E-commerce Website Template</title>
		<link rel="stylesheet" href="./css/index.css" />
		<link rel="shortcut icon" href="./icon/favicon.ico" type="image/x-icon" />
	</head>
	<body>
		<header class="header">
			<div class="container header__container">
				<div class="top-banner">
					<p class="top-banner__title">
						<span
							>Зарегестрируйтесь и получите скидку 20% на первую покупку.</span
						>
						<a class="top-banner__link" href="#">Зарегестрироваться сейчас</a>
					</p>
					<button class="top-banner__close">
						<svg class="icon" width="24" height="24">
							<use xlink:href="./icon/sprite.svg#close"></use>
						</svg>
					</button>
				</div>
				<div class="header__nav">
					<img class="logo__img" src="./icon/SHOP.CO.svg" alt="Logo" />
					<nav class="menu header__menu" id="header-menu">
						<ul class="menu__list">
							<li class="menu__item">
								<a class="menu__link" href="#">Магазин</a>

								<!-- <button class="menu__arrow">
                  <svg class="menu__arrow-img" width="16" height="16">
                    <use xlink:href="./icon/sprite.svg#menu_arrow"></use>
                  </svg>
                </button> -->
							</li>
							<li class="menu__item">
								<a class="menu__link" href="#">Скидки</a>
							</li>
							<li class="menu__item">
								<a class="menu__link" href="#">Новое поступление</a>
							</li>
							<li class="menu__item">
								<a class="menu__link" href="#">Бренды</a>
							</li>
						</ul>
					</nav>
					<div class="search">
						<svg class="search__icon" width="20" height="20">
							<use xlink:href="./icon/sprite.svg#search"></use>
						</svg>
						<input
							class="search__input"
							type="text"
							placeholder="Искать товары..."
						/>
					</div>
					<div class="header__actions">
						<button class="header__action">
							<svg class="icon" width="24" height="24">
								<use xlink:href="./icon/sprite.svg#cart"></use>
							</svg>
						</button>
						<button class="header__action">
							<svg class="icon" width="24" height="24">
								<use xlink:href="./icon/sprite.svg#user"></use>
							</svg>
						</button>
					</div>
				</div>
			</div>
		</header>
		<main>
			<section class="hero">
				<div class="container hero__container">
					<div class="hero__content">
						<h1 class="hero__title title-mb">
							НАЙДИ ОДЕЖДУ КОТОРАЯ ВЫРАЗИТ ТВОЙ СТИЛЬ
						</h1>
						<p class="hero__description">
							Просмотрите наш набор тщательно сделанной одежды, созданный чтобы
							подчеркнуть ваш индивидуальный стиль.
						</p>
					</div>
					<picture>
						<source
							srcset="./image/hero-background-img.webp"
							type="image/webp"
						/>
						<img
							src="./image/hero-background-img.png"
							alt="Мужчина и женщина в модной одежде"
							class="hero__img"
						/>
					</picture>
				</div>
			</section>
		</main>
	</body>
</html>
